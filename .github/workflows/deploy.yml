name: Deploy to Vercel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Clean and Export Vercel Env to GitHub System
        run: |
          # 1. Clean CRLF (Windows) and quotes, write to temporary file
          tr -d '\r' < .vercel/.env.production.local | sed -e 's/="/=/g' -e 's/"$//g' > .vercel/env_clean.txt
          
          # 2. Read clean file and export to GITHUB_ENV so Vercel CLI / Vite can access it globally
          while IFS= read -r line || [ -n "$line" ]; do
            if [[ ! "$line" =~ ^# ]] && [[ -n "$line" ]]; then
              echo "$line" >> $GITHUB_ENV
            fi
          done < .vercel/env_clean.txt

      - name: Diagnose Loaded System Variables
        run: |
          echo "=== Active VITE_ variables in GITHUB_ENV ==="
          env | grep VITE_ | cut -d'=' -f1 || echo "No VITE_ variables found in system env"

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
