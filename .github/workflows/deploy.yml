name: Deploy to Vercel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Clean and Copy Env Variables with Node.js
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const srcPath = path.join('.vercel', '.env.production.local');
          if (fs.existsSync(srcPath)) {
            const content = fs.readFileSync(srcPath, 'utf8');
            const lines = content.split(/\r?\n/);
            const cleanLines = lines.map(line => {
              if (!line.trim() || line.trim().startsWith('#')) return line;
              const eqIndex = line.indexOf('=');
              if (eqIndex === -1) return line;
              const key = line.slice(0, eqIndex).trim();
              let val = line.slice(eqIndex + 1).trim();
              if (val.startsWith('\"') && val.endsWith('\"')) val = val.slice(1, -1);
              if (val.startsWith('\'') && val.endsWith('\'')) val = val.slice(1, -1);
              return key + '=' + val;
            });
            fs.writeFileSync('.env.production', cleanLines.join('\n'), 'utf8');
            fs.writeFileSync('.env', cleanLines.join('\n'), 'utf8');
            console.log('Environment variables cleaned and written to root.');
          } else {
            console.error('Source env file not found!');
            process.exit(1);
          }
          "

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
