name: Deploy to Vercel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: |
          vercel pull \
            --yes \
            --environment=production \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Inspect env file
        run: |
          echo "=================="
          cat .vercel/.env.production.local
          echo "=================="    

      - name: Show downloaded variable names
        run: |
          echo "Variables descargadas desde Vercel:"
          grep -v '^#' .vercel/.env.production.local | cut -d= -f1

      - name: Export variables to GitHub Actions
        run: |
          grep -v '^#' .vercel/.env.production.local | grep -v '^$' >> $GITHUB_ENV

      - name: Verify VITE variables
        run: |
          echo "Variables VITE encontradas:"
          env | grep '^VITE_' || echo "No se encontraron variables VITE"

      - name: Create Vite env file
        run: |
          cp .vercel/.env.production.local .env.production

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Build Vercel Output
        run: |
          vercel build \
            --prod \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel
        run: |
          vercel deploy \
            --prebuilt \
            --prod \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}